name: ולידציה ופרסום לחנות אוצריא

# מקפל את התוסף, מריץ את אותן בדיקות כמו חנות אוצריא, מפרסם אוטומטית
# כשגרסה חדשה נדחפת ל-main, ויוצר GitHub Release עם קובץ ה-.otzplugin.
# גרסה שכבר קיימת בחנות לא תפורסם מחדש (אלא אם force=true), אז דחיפה
# רגילה בטוחה.
#
# איך זה משתלב במסלול האריזה הקיים (build/pack.ps1):
#   .\build\pack.ps1 -Release  →  bump מניפסט + CHANGELOG + הטמעת המוטבעים
#                                 + commit + תג v<version> + push + GitHub Release
# הדחיפה הזו (שנוגעת ב-manifest.json) היא מה שמפעיל את ה-workflow, והוא מוסיף
# את החלק שחסר מקומית: **הפרסום לחנות**. אם ה-Release כבר נוצר ע״י pack.ps1,
# השלב האחרון כאן מדלג עליו במקום להתנגש.
#
# ⚠️ הטריגר האוטומטי הוא על main בלבד. אריזה שנדחפה מענף אחר (למשל ypl) לא
# תפורסם מעצמה — או למזג ל-main, או להריץ ידנית מלשונית Actions.

on:
  push:
    # #55: כל ענף — אבל רק main מפרסם. בשאר הענפים ובכל PR רץ ה-job ״validate״
    # (ולידציה בלי פרסום), כדי שבעיה תתגלה לפני המיזוג ולא אחריו.
    branches: ['**']
    paths:
      # רק מה שנכנס בפועל לחבילה — 6 פריטי המוצר, זהים ל-!/-entries ב-.otzignore
      # ול-$includeItems ב-build/pack.ps1. שינוי ב-_עבודה/ (assets, docs וכו') אינו
      # שינוי מוצר ואינו אמור להפעיל פרסום.
      - 'manifest.json'
      - 'index.html'
      - 'background.html'
      - 'guides/**'
      - 'shell/**'
      - 'icon/**'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - '.otzignore'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - 'index.html'
      - 'background.html'
      - 'guides/**'
      - 'shell/**'
      - 'icon/**'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - '.otzignore'
      - '.github/workflows/publish.yml'
  workflow_dispatch:        # מאפשר הרצה ידנית מלשונית Actions
    inputs:
      publish:
        description: 'לפרסם לחנות? (auto/true/false)'
        default: 'auto'
      force:
        description: 'לפרסם גם אם הגרסה כבר קיימת'
        type: boolean
        default: false

permissions:
  contents: write           # נדרש כדי ליצור GitHub Release

# דחיפת הקומיט והתג של אותה אריזה עלולות להגיע כמעט יחד. תור לפי גרסה, בלי
# ביטול באמצע: הריצה השנייה תמתין ואז תראה שהגרסה כבר בחנות ותדלג.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # #55: ולידציה בלי פרסום — ענפים שאינם main ו-PR-ים. אותן בדיקות כמו בפרסום,
  # ובלי פרטי החנות (publish: 'false'), כך שאין שום דרך שענף יגיע לחנות.
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: בדיקת סנכרון המוטבעים
        run: node tools/verify-embedded.js
      - name: ולידציית דאטה (מדווחת בלבד)
        continue-on-error: true
        run: node tools/validate.js --strict
      - name: סט הזהב של מנוע הזיהוי (מדווח בלבד)
        continue-on-error: true
        run: node tools/identify-bench.js
      # #91: גרש ASCII בודד בהערה תוקע את הוולידטור של אוצריא. חוסם כאן, ב-PR/ענף,
      # כדי שזה לא יגיע ל-main ויגרום ל-timeout שקט בשלב הפרסום.
      - name: בדיקת היתקעות הוולידטור (גרשים בהערות)
        run: node tools/check-comment-quotes.js
      - name: ולידציה וקיפול של אוצריא (בלי פרסום)
        timeout-minutes: 2
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: .
          publish: 'false'

  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # #92: בלי זה ריצה שנתקעת מול שרת החנות רצה 6 שעות (ברירת המחדל של GitHub)
    # וחוסמת את תור הפרסום שאחריה. 20 דקות מספיקות לולידציה + קיפול + פרסום.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # שער חובה. שלושה קבצים ב-guides/_shared/ מוטבעים ע״י build/pack.ps1
      # (שלבים 1ג/1ד/1ה) כי fetch() של קובץ מקומי מהחבילה נכשל ב-WebView של
      # אוצריא. עריכה של CHANGELOG.md / ROADMAP.md / manifest.json בלי אריזה
      # מחדש = חבילה שמציגה למשתמשים תוכן ישן, בשקט ובלי שגיאה. נעצרים כאן.
      - name: בדיקת סנכרון המוטבעים
        run: node tools/verify-embedded.js

      # ולידציית הדאטה. `--strict` מחזיר 1 גם על ממצאי תוכן מוכרים שמוקפאים
      # במכוון עד ת.1א (ר׳ ההערה בסעיף 0 של build/pack.ps1), ולכן היא מדווחת
      # ולא חוסמת — הפלט כאן הוא כדי לראות רגרסיה, לא כדי לעצור פרסום.
      - name: ולידציית דאטה (מדווחת בלבד)
        continue-on-error: true
        run: node tools/validate.js --strict

      # #91 (08/10/2026): הסיבה האמיתית להיתקעות ה-Action — גרש ASCII בודד בהערה
      # (guides/animal/data/animal-data.js) הפך את זוגיות המחרוזות ב-stripCommentsForScan
      # של הוולידטור, וה-regex של ליטרלי-regex רץ בזמן ריבועי. מדווח כאן (לא חוסם),
      # כדי שה-Release ייווצר גם אם זה חוזר; ב-job ״validate״ למעלה הוא חוסם.
      - name: בדיקת היתקעות הוולידטור (גרשים בהערות)
        continue-on-error: true
        run: node tools/check-comment-quotes.js

      # Action רשמי של אוצריא: ולידציה, קיפול ל-.otzplugin (מכבד .otzignore),
      # ופרסום לחנות. אין שלב build — קבצי הנתונים כבר בגיט.
      # מוגבל ל-2 דקות (לבקשת בעלת הפרויקט) וממשיכים: ה-Release נוצר בכל מקרה (שלב
      # ״אריזה ל-Release״ למטה). עד 4.17.0 הוא נתקע תמיד — ר׳ ההערה על הבדיקה שלמעלה.
      - name: ולידציה, קיפול ופרסום
        id: otzaria
        timeout-minutes: 2
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: .
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          publish: ${{ github.event.inputs.publish || 'auto' }}
          force: ${{ github.event.inputs.force || false }}
          # לשחרור ראשון של תוסף חדש החנות דורשת צילומי מסך. יש חומר ב-
          # assets/icons-store/ ו-docs/screenshots/, אבל בשמות עבריים עם
          # רווחים — להעתיק 2-3 מהם ל-screenshots/01.png וכו׳ לפני שמפעילים:
          # screenshots: 'screenshots/01.png,screenshots/02.png'

      # שומר גודל, במקביל לסעיף 5 ב-build/pack.ps1. מאז המעבר ל-whitelist ב-
      # .otzignore תיקיית עבודה חדשה כבר לא יכולה להיכנס לחבילה, והרף הישן
      # (16MB) לא רלוונטי: הרגילה ~18MB (תמונות מוטבעות), וריאנט המפות ~63MB,
      # +~40MB כשמצורפים אריחי מפה — הכול תקין. רשת ביטחון רופפת בלבד.
      - name: שומר גודל החבילה
        env:
          PLUGIN_FILE: ${{ steps.otzaria.outputs.plugin-file }}
        run: |
          if [[ -z "$PLUGIN_FILE" || ! -f "$PLUGIN_FILE" ]]; then
            echo "::warning::קובץ החבילה לא נמצא בפלט ה-Action — מדלג על בדיקת הגודל."
            exit 0
          fi
          bytes="$(stat -c%s "$PLUGIN_FILE")"
          mb="$(awk "BEGIN{printf \"%.1f\", $bytes/1048576}")"
          echo "גודל החבילה: $mb MB"
          if (( bytes > 41943040 )); then
            echo "::warning::החבילה גדולה מהצפוי ($mb MB, הרף 40MB). בדוק מה תפח בתוך guides/."
          fi

      # 4.17.0: החבילה ל-Release נארזת תמיד ע״י tools/pack-otzplugin.js — פורמט זהה
      # לאורז הרשמי של אוצריא. עד 4.16.1, כשה-Action נתקע, נארזה כאן חבילה ב-`zip -qr`
      # ודף ההעלאה ב-otzaria.org דחה אותה (״לא ניתן לקרוא את manifest.json מקובץ התוסף״).
      # הסינון זהה ל-.otzignore (רשימה לבנה + החרגות בתוך guides/).
      - name: אריזה ל-Release (פורמט האורז הרשמי)
        id: fallback
        env:
          PLUGIN_FILE: ${{ steps.otzaria.outputs.plugin-file }}
        run: |
          id="$(node -p "require('./manifest.json').id")"
          version="$(node -p "require('./manifest.json').version")"
          out="$id-$version.otzplugin"
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          cp -r manifest.json index.html background.html icon shell guides /tmp/stage/
          rm -f /tmp/stage/guides/*/view.html /tmp/stage/guides/places/css/app.css /tmp/stage/guides/places/js/app.js /tmp/stage/guides/places/README.md
          rm -rf /tmp/stage/guides/places/tiles
          rm -f "$out"
          node tools/pack-otzplugin.js /tmp/stage "$out"
          if [[ -z "$PLUGIN_FILE" ]]; then
            echo "::warning::ה-Action של אוצריא לא הפיק חבילה (#91) — הפרסום לחנות לא בוצע. את החבילה מה-Release אפשר להעלות ידנית ל-otzaria.org."
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: קביעת גרסה ותג
        id: meta
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "גרסה לא תקינה ב-manifest.json: '$version' (צפוי X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"   >> "$GITHUB_OUTPUT"

      - name: בדיקה אם ה-Release כבר קיים
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ה-Release $TAG כבר קיים - מדלג על יצירה"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "ה-Release $TAG עדיין לא קיים"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # גוף ה-Release = ערך ה-CHANGELOG של הגרסה הזו בלבד (עד הכותרת ## הבאה),
      # בדיוק כמו סעיף 6 ב-build/pack.ps1, ומתחתיו הוראות התקנה ו-checksum.
      - name: הכנת גוף ה-Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.otzaria.outputs.sha256 }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            // סריקת שורות ולא regex: הערך נמשך עד כותרת "## " הבאה, וב-regex
            // עם דגל m הסימן $ נתפס בסוף *כל* שורה וקיצץ את הערך לכותרת בלבד.
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l === "## " + v || l.startsWith("## " + v + " "));
            let end = lines.length;
            if (start >= 0) {
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith("## ")) { end = i; break; }
              }
            }
            const entry = start < 0 ? "## " + v : lines.slice(start, end).join("\n").trim();
            const out = [
              entry,
              "",
              "### התקנה",
              "הורד את קובץ ה-`.otzplugin` למטה, ובאוצריא:",
              "**כלים → 🧩 תוספים → ⊕ התקן תוסף חדש**, ובחר את הקובץ.",
              "",
              "### Checksum",
              "```",
              "SHA-256: " + (process.env.SHA256 || "—"),
              "```",
              "",
            ].join("\n");
            fs.writeFileSync("release-notes.md", out);
          '
          cat release-notes.md

      - name: יצירת GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: עינים למקרא ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.fallback.outputs.file }}
          body_path: release-notes.md

      # ״עינים למקרא+״ — אותה חבילה עם אריחי מפה אופליין (guides/places/tiles,
      # ~55MB). האריחים אינם בגיט, ולכן נמשכים מחבילת ה-offlinemaps האחרונה
      # שצורפה ל-Release קודם, ומוזרקים לחבילה של הגרסה הנוכחית. אותם שינויי
      # מניפסט כמו build/pack-offline-maps-variant.ps1, ובנוסף שם ספק נפרד לספרייה
      # כדי ששתי החבילות יוכלו להיות מותקנות יחד.
      - name: עינים למקרא+ (מפות אופליין) — צירוף ל-Release
        id: plus
        if: steps.meta.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE_FILE: ${{ steps.fallback.outputs.file }}
        run: |
          set -e
          rm -rf /tmp/plus && mkdir -p /tmp/plus/tilesrc
          unzip -q "$BASE_FILE" -d /tmp/plus/pkg
          # #126: מקור האריחים הוא נכס קבוע — places-tiles-png.zip ב-Release ״tiles-source״
          # (PNG מקורי, בלי איבוד). עד 4.17.0 הם נמשכו מחבילת הפלוס הקודמת, שכבר כווצה ל-WebP
          # q75, וכל אריזה כיווצה שוב את המכווץ — מכאן הטשטוש. אם הנכס חסר (ריצה ראשונה), הוא
          # נבנה כאן פעם אחת מה-Release האחרון שהאריחים בו עדיין PNG (4.15.0), ונשמר.
          if gh release view tiles-source --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download tiles-source --repo "$GITHUB_REPOSITORY" -p places-tiles-png.zip -D /tmp/plus --clobber
          else
            src_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name | test("^v")) | select(any(.assets[]; .name | endswith("-offlinemaps.otzplugin")))] | map(.tag_name)[]' | while read -r tg; do
              aid="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tg" --jq '.assets[] | select(.name | endswith("-offlinemaps.otzplugin")) | .id' | head -1)"
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > /tmp/plus/cand.zip
              if unzip -l /tmp/plus/cand.zip 'guides/places/tiles/*.png' 2>/dev/null | grep -q '\.png'; then echo "$tg"; break; fi
            done)"
            if [[ -z "$src_tag" ]]; then echo "::warning::לא נמצא Release עם אריחי PNG — מדלג על הפלוס."; exit 0; fi
            echo "בונה את נכס האריחים מ-$src_tag"
            unzip -q /tmp/plus/cand.zip 'guides/places/tiles/*' -d /tmp/plus/boot
            (cd /tmp/plus/boot/guides/places && zip -q -0 -r /tmp/plus/places-tiles-png.zip tiles)
            gh release create tiles-source /tmp/plus/places-tiles-png.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "מקור אריחי המפה (PNG) — לא להתקנה" \
              --notes "נכס קבוע ל-CI (#126): אריחי OpenStreetMap המקוריים של עינים למקרא+ (PNG, בלי איבוד), מתוך $src_tag. ה-workflow ממיר מהם בכל אריזה. זו לא גרסה להתקנה."
          fi
          unzip -q /tmp/plus/places-tiles-png.zip -d /tmp/plus/tilesrc
          cp -r /tmp/plus/tilesrc/tiles /tmp/plus/pkg/guides/places/
          # WebP q90 מה-PNG המקורי: הרחובות והשמות חדים (q75 טשטש אותם), והחבילה ~44MB —
          # מתחת למגבלת 50MB של החנות. lossless יוצא ~50MB, ולכן לא נבחר.
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import pathlib
          from multiprocessing import Pool
          from PIL import Image
          def conv(p):
              Image.open(p).convert('RGB').save(p.with_suffix('.webp'), 'WEBP', quality=90, method=4); p.unlink()
          ps = list(pathlib.Path('/tmp/plus/pkg/guides/places/tiles').rglob('*.png'))
          with Pool() as pool: pool.map(conv, ps, chunksize=64)
          print('converted to webp q90:', len(ps))
          PY
          sed -i "s#tiles/{z}/{x}/{y}.png#tiles/{z}/{x}/{y}.webp#" /tmp/plus/pkg/guides/places/js/map.js
          grep -q "tiles/{z}/{x}/{y}.webp" /tmp/plus/pkg/guides/places/js/map.js || { echo "::error::עדכון סיומת האריחים ב-map.js נכשל"; exit 1; }
          node -e '
            const fs = require("fs"), p = "/tmp/plus/pkg/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.id = "com.chadbedera.madaeihatanachplus";
            m.name = m.name + "+";
            m.description = "מדריך מאוחד לתנ״ך ומשנה/תלמוד עם מפת OpenStreetMap מפורטת מוטמעת (בלי אינטרנט) - אישים, מקומות, בע״ח, צומח, דומם, בית המקדש, מסכתות.";
            const c = m.contributes || {};
            if (c.toolTab){ c.toolTab.title = m.name; c.toolTab.iconName = "eye_24_filled"; }
            const st = c.startup || {};
            (st.toolbarItems || []).forEach(t => { t.icon = "eye_24_filled"; t.title = m.name; });
            (st.libraryBooks || []).forEach(b => { b.provider = "einayim-lamikra-plus"; b.title = m.name; });
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
          sed -i "s/const LIBRARY_PROVIDER = 'einayim-lamikra';/const LIBRARY_PROVIDER = 'einayim-lamikra-plus';/" /tmp/plus/pkg/shell/core.js
          # #98: שם התצוגה בכל התוסף (יומן, ספרייה, הדפסה, קיצור דרך, כותרת)
          sed -i "s/^const PLUGIN_DISPLAY_NAME = 'עינים למקרא';/const PLUGIN_DISPLAY_NAME = 'עינים למקרא+';/" /tmp/plus/pkg/shell/core.js
          grep -q "^const PLUGIN_DISPLAY_NAME = 'עינים למקרא+';" /tmp/plus/pkg/shell/core.js || { echo "::error::החלפת PLUGIN_DISPLAY_NAME בווריאנט נכשלה"; exit 1; }
          out="com.chadbedera.madaeihatanach-$VERSION-offlinemaps.otzplugin"
          node tools/pack-otzplugin.js /tmp/plus/pkg "$GITHUB_WORKSPACE/$out"
          ls -la "$out"
          # #127: החנות מוגבלת ל-50MB. מעל זה — לא מעלים לחנות (ה-Release עדיין מקבל את הקובץ).
          if (( $(stat -c%s "$out") > 50000000 )); then echo "::warning::חבילת הפלוס מעל 50MB — לא תישלח לחנות"; too_big=1; fi
          gh release upload "$TAG" "$out" --clobber --repo "$GITHUB_REPOSITORY"
          # צילומי מסך לפרסום הראשון של הפלוס בחנות (השלב הבא). שמות ASCII, מחוץ לחבילה.
          mkdir -p /tmp/plus-shots
          cp "docs/screenshots/ביוגרפיות תקופות.png" /tmp/plus-shots/01.png
          cp "docs/screenshots/בעלי חיים2.png" /tmp/plus-shots/02.png
          # #127: הוחלט (בעלת הפרויקט, 09/10/2026) — הפלוס לא נשלח לחנות עד תשובה מאוצריא.
          # הקובץ עדיין מצורף ל-Release. כשתגיע תשובה: למחוק את השורה PLUS_HOLD ולהחזיר את הבדיקה.
          PLUS_HOLD=1
          [[ -z "$too_big" && -z "$PLUS_HOLD" ]] && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "::notice::הפלוס לא נשלח לחנות (#127)"

      # 08/10/2026 (באישור בעלת הפרויקט): עינים למקרא+ לא עלה לחנות דרך דף ״תוסף חדש״
      # באתר (״לא ניתן לקרוא את manifest.json מקובץ התוסף״ — 4,677 קבצים, #91). כאן
      # הוא נשלח דרך ה-API של החנות, כמו החבילה הרגילה: בפעם הראשונה כתוסף חדש
      # (צילומי מסך + אישור קבלת דיווחים במייל, כפי שנדרש באתר), ואחר כך כעדכון גרסה.
      # תגובת השרת נכתבת ללוג — אם הוא דוחה, שם רואים את השגיאה המדויקת.
      - name: עינים למקרא+ — פרסום לחנות
        if: steps.plus.outputs.ready == 'true'
        timeout-minutes: 6
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: /tmp/plus/pkg
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          publish: ${{ github.event.inputs.publish || 'auto' }}
          force: ${{ github.event.inputs.force || false }}
          screenshots: '/tmp/plus-shots/01.png,/tmp/plus-shots/02.png'
          reports-consent: 'true'
