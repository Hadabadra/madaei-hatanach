<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אישים בתנ״ך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ /* 5.0.0 — צבעים שהיו קשיחים בכללים */ --c-fff:#fff; 
    --parchment:#EAEEF6; --parchment-deep:#DDE3F0; --card:#F7F9FD;
    --ink:#20263A; --ink-soft:#565F7A; --forest:#38508E; --forest-deep:#28396A;
    --rust:#B4622F; --rust-deep:#8C4A22; --gold:#C6952E; --gold-light:#D9AE58;
    --teal:#3E7A8C; --line:#C7D0E4; --shadow:0 10px 30px rgba(32,38,58,.22);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.25), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(0,0,0,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 3px),
      var(--parchment);
    color:var(--ink); font-family:'Heebo',sans-serif; line-height:1.6;
  }
  h1,h2,h3,.display{font-family:'Frank Ruhl Libre',serif;}

  .hero{position:relative; padding:56px 24px 34px; text-align:center; border-bottom:3px double var(--gold);
    background:linear-gradient(180deg, rgba(169,129,47,0.08), transparent 70%); overflow:hidden;}
  .eyebrow{letter-spacing:.35em; font-size:12px; color:var(--gold); font-weight:700; margin-bottom:14px;}
  .hero h1{font-size:clamp(28px,5vw,48px); font-weight:900; margin:0 0 10px; color:var(--ink);}
  .hero p.sub{max-width:680px; margin:0 auto; color:var(--ink-soft); font-size:15px;}
  .badge-note{display:inline-block; margin-top:14px; font-size:12.5px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:6px 14px; color:var(--ink-soft);}
  .lightbulb-btn{position:absolute; top:16px; left:16px; z-index:5; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .lightbulb-btn:hover{background:var(--gold-light); color:var(--c-fff);}
  .lookup-status{display:none; font-size:12px; margin-top:8px; padding:5px 12px; border-radius:14px;}
  .lookup-status.ok{display:inline-block; background:rgba(63,91,68,.12); color:var(--forest-deep);}
  .lookup-status.err{display:inline-block; background:rgba(156,74,46,.12); color:var(--rust-deep);}

  .controls{position:sticky; top:0; z-index:50; background:rgba(237,227,200,0.96); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 20px;}
  .controls-inner{max-width:1180px;margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  #search{flex:1; min-width:180px; padding:10px 16px; border-radius:20px; border:1px solid var(--line);
    background:var(--c-fff); font-family:'Heebo',sans-serif; font-size:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; max-width:1180px; margin:10px auto 0;}
  .chip{border:1px solid var(--line); background:var(--card); border-radius:16px; padding:6px 14px;
    font-size:12.5px; cursor:pointer; color:var(--ink-soft);}
  .chip.active{background:var(--forest); color:var(--c-fff); border-color:var(--forest);}
  .count-tag{opacity:.7; font-size:11px;}

  #main{max-width:1180px; margin:0 auto; padding:24px 20px 80px;}
  .category-section.hidden{display:none;}
  .cat-head{display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--gold); padding-bottom:8px; margin-top:34px;}
  .cat-num{font-family:'Frank Ruhl Libre',serif; font-size:17px; color:var(--c-fff); background:var(--forest); font-weight:900;
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .cat-head h2{margin:0; font-size:20px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden; cursor:pointer;
    transition:transform .15s, box-shadow .15s;}
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .card.hidden{display:none;}
  .card-avatar{width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--forest),var(--teal));
    color:var(--c-fff); display:flex; align-items:center; justify-content:center; font-family:'Frank Ruhl Libre',serif;
    font-size:18px; font-weight:900; margin:14px 14px 0; flex:0 0 auto;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .card-roles{display:flex; flex-wrap:wrap; gap:5px; padding:12px 14px 0; flex:1;}
  .role-tag{font-size:10.5px; background:var(--forest); color:var(--c-fff); border-radius:20px; padding:2px 10px;}
  .card-body{padding:8px 14px 16px;}
  .card-name{margin:4px 0 4px; font-size:17px;}
  .card-verse{font-size:11.5px; color:var(--gold); font-weight:600;}
  .card-desc{font-size:12.5px; color:var(--ink-soft); margin:6px 0 0;}
  .empty-msg{text-align:center; color:var(--ink-soft); margin-top:40px;}
  .empty-msg.hidden{display:none;}

  .overlay{position:fixed; inset:0; background:rgba(30,24,15,.55); display:none; align-items:flex-start; justify-content:center;
    z-index:100; overflow-y:auto; padding:30px 16px;}
  .overlay.open{display:flex;}
  .modal{background:var(--parchment-deep); border-radius:26px; max-width:760px; width:100%; box-shadow:var(--shadow); position:relative;}
  .modal-close{position:absolute; top:12px; left:12px; background:var(--card); border:1px solid var(--line); border-radius:50%;
    width:32px; height:32px; cursor:pointer; font-size:16px;}
  .modal-actions{position:absolute; top:12px; right:52px; display:flex; gap:8px;}
  .icon-btn{background:var(--card); border:1px solid var(--line); border-radius:50%; width:32px; height:32px;
    cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--gold-light); color:var(--c-fff);}
  .modal-head{padding:24px 84px 10px 26px;}
  .modal-head h2{margin:0 0 4px; font-size:24px;}
  .cat-line{font-size:12.5px; color:var(--ink-soft);}
  .modal-body{padding:10px 26px 26px;}
  .info-table{width:100%; border-collapse:collapse; margin:14px 0;}
  .info-table tr{border-bottom:1px solid var(--line);}
  .info-table td{padding:8px 6px; font-size:13.5px; vertical-align:top;}
  .info-table td.k{color:var(--gold); font-weight:700; white-space:nowrap; width:110px;}
  .info-table td.v{color:var(--ink);}
  .role-tag.big{font-size:12px; padding:3px 11px;}
  h3.section-h{font-size:14px; color:var(--forest-deep); border-bottom:1px solid var(--line); padding-bottom:5px; margin:22px 0 10px;}
  .verse-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px;}
  .verse-card.clickable{cursor:pointer;}
  .verse-card.clickable:hover{border-color:var(--gold);}
  .verse-ref{font-weight:700; font-size:13px; color:var(--rust-deep); margin-bottom:4px;}
  .open-hint{font-size:11px; color:var(--gold); font-weight:400;}
  .verse-text{font-size:16px; line-height:1.9;}
  .verse-text.empty{color:var(--ink-soft); font-style:italic; font-size:13px;}
  .no-src{font-size:12.5px; color:var(--ink-soft); font-style:italic;}
  .unknown{color:var(--ink-soft); font-style:italic; opacity:.7;}
  .src-item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
  .src-item.clickable{cursor:pointer;}
  .src-source{font-weight:700; font-size:12.5px; color:var(--rust-deep);}
  .src-note{font-size:12.5px; margin-top:3px;}
  .src-link{font-size:12px; color:var(--teal); display:inline-block; margin-top:5px;}
  .placeholder-icon{width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; background:var(--parchment-deep);}
  .card-media{position:relative;}
  .multi-list{display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px;}
  .multi-item{flex:0 0 150px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; text-align:center;}
  .multi-item.active{border-color:var(--gold); background:var(--gold-light); color:var(--c-fff);}
  .multi-item-name{font-size:12.5px; font-weight:700; margin-top:4px;}
  .multi-item-desc{font-size:10.5px; margin-top:2px;}
  .nf-form input, .nf-form textarea{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit; margin-bottom:10px;}
  .field-label{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  .nf-actions{display:flex; gap:10px;}
  .nf-btn{background:var(--forest); color:var(--c-fff); border:none; border-radius:10px; padding:9px 16px; cursor:pointer; font-size:13px;}
  .nf-btn.secondary{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .hidden{display:none;}
  .person-link{color:var(--forest); cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px;}
  .person-link:hover{color:var(--rust);}
  .filter-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:1180px; margin:8px auto 0;}
  .filter-label{font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .alpha-bar{display:flex; flex-wrap:wrap; gap:5px;}
  .alpha-btn{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .alpha-btn.active{background:var(--rust); color:var(--c-fff); border-color:var(--rust);}
  .edit-field{margin-bottom:10px;}
  @media print{
    body *{visibility:hidden;}
    .overlay{position:static !important; background:none !important; padding:0 !important; display:block !important;}
    .modal, .modal *{visibility:visible;}
    .modal{position:absolute; top:0; right:0; width:100%; max-width:100%; box-shadow:none; border:none; box-sizing:border-box;}
    .modal-close, .modal-actions, .nf-actions, .open-hint{display:none !important;}
  }
</style>
</head>

  {id:'melachim', num:'ט', label:'ספר מלכים', blurb:'שלמה המלך, התפלגות הממלכה, מלכי יהודה וישראל והנביאים בימיהם.', era:'תקופת המלכים ובית ראשון'},

<script src="data/people-data.js"></script>
<script>

let activeCat = 'all';

function roleTags(roles, big){
  return (roles||[]).map(r=>`<span class="role-tag${big?' big':''}">${r}</span>`).join('');
}

function summaryLine(item){
  const parts = [];
  if(item.father || item.mother){
    const pp = [item.father, item.mother].filter(Boolean).join(' ו');
    parts.push('בן/בת ' + pp);
  }
  if(item.age) parts.push('חי ' + item.age);
  return parts.join(' · ');
}

function catEra(catId){
  const c = CATS.find(x=>x.id===catId);
  return (c && c.era) || '';
}
function firstLetter(name){
  const n = normalizeHeb(name||'');
  return n ? n[0] : '';
}

function cardHTML(item, idx){
  const firstVerse = item.verses[0] ? item.verses[0].ref : '';
  const searchBlob = (item.name+' '+firstVerse+' '+(item.aliases||[]).join(' ')+' '+(item.roles||[]).join(' ')+' '+(item.dwelling||'')+' '+(item.tribe||'')).toLowerCase();
  return `
  <div class="card" data-cat="${item.cat}" data-era="${catEra(item.cat)}" data-letter="${firstLetter(item.name)}" data-idx="${idx}" data-search="${searchBlob}">
    <div class="card-top">
      <div class="card-avatar">${(item.name||'?')[0]}</div>
      <div class="card-roles">${roleTags(item.roles)}</div>
    </div>
    <div class="card-body">
      <h3 class="card-name">${item.name}</h3>
      <span class="card-verse">${firstVerse}${item.verses.length>1 ? ' ועוד' : ''}</span>
      <p class="card-desc">${summaryLine(item)}</p>
    </div>
  </div>`;
}

let activeEra = 'all';
let activeLetter = 'all';
let searchQ = '';

function render(){
  document.getElementById('heroSub').textContent = 'פרטי חיים — הורים, בני זוג, ילדים, שבט, תפקיד, מקום ופטירה — של אישים בתנ״ך, לפי סדר הספרים.';
  document.getElementById('badgeNote').textContent = '✓ ' + DATA.length + ' ערכים מבוססי פסוקים — עבודה מתמשכת, המדריך הולך וגדל.';
  const main = document.getElementById('main');
  main.innerHTML = CATS.map(cat=>{
    const items = DATA.map((d,i)=>({...d, idx:i})).filter(d=>d.cat===cat.id);
    if(!items.length) return '';
    return `
    <section class="category-section" id="${cat.id}">
      <div class="cat-head">
        <span class="cat-num">${cat.num}</span>
        <h2>${cat.label}</h2>
        <span class="count-tag">(${items.length})</span>
      </div>
      <p style="color:var(--ink-soft);font-size:13.5px;max-width:760px;margin:8px 0 20px;">${cat.blurb}</p>
      <div class="grid">${items.map(it=>cardHTML(it, it.idx)).join('')}</div>
    </section>`;
  }).join('') + `<p class="empty-msg hidden" id="emptyMsg">לא נמצאו תוצאות התואמות את הסינון.</p>`;

  const chipsWrap = document.getElementById('chips');
  chipsWrap.innerHTML = `<button class="chip active" data-cat="all">הכל <span class="count-tag">(${DATA.length})</span></button>` +
    CATS.filter(c=>DATA.some(d=>d.cat===c.id)).map(c=>`<button class="chip" data-cat="${c.id}">${c.label}</button>`).join('');

  const eras = [];
  CATS.forEach(c=>{ if(c.era && DATA.some(d=>d.cat===c.id) && !eras.includes(c.era)) eras.push(c.era); });
  const eraWrap = document.getElementById('eraChips');
  eraWrap.innerHTML = `<button class="chip active" data-era="all">הכל</button>` +
    eras.map(e=>`<button class="chip" data-era="${e}">${e}</button>`).join('');

  const letters = [];
  document.querySelectorAll('#main .card').forEach(c=>{ const l=c.dataset.letter; if(l && !letters.includes(l)) letters.push(l); });
  const ALEPH_BET = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];
  const alphaWrap = document.getElementById('alphaBar');
  alphaWrap.innerHTML = `<button class="alpha-btn active" data-letter="all">*</button>` +
    ALEPH_BET.filter(l=>letters.includes(l)).map(l=>`<button class="alpha-btn" data-letter="${l}">${l}</button>`).join('');

  attachEvents();
  applyFilters();
}

function cardMatches(card){
  if(activeCat!=='all' && card.dataset.cat!==activeCat) return false;
  if(activeEra!=='all' && card.dataset.era!==activeEra) return false;
  if(activeLetter!=='all' && card.dataset.letter!==activeLetter) return false;
  if(searchQ && !card.dataset.search.includes(searchQ)) return false;
  return true;
}

function applyFilters(){
  let anyVisible = false;
  document.querySelectorAll('.category-section').forEach(sec=>{
    let has = false;
    sec.querySelectorAll('.card').forEach(card=>{
      const match = cardMatches(card);
      card.classList.toggle('hidden', !match);
      if(match) has = true;
    });
    sec.classList.toggle('hidden', !has);
    if(has) anyVisible = true;
  });
  document.getElementById('emptyMsg').classList.toggle('hidden', anyVisible);
}

function attachEvents(){
  document.querySelectorAll('#chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      applyFilters();
    });
  });
  document.querySelectorAll('#eraChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#eraChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeEra = chip.dataset.era;
      applyFilters();
    });
  });
  document.querySelectorAll('#alphaBar .alpha-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#alphaBar .alpha-btn').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      activeLetter = btn.dataset.letter;
      applyFilters();
    });
  });
  document.getElementById('search').addEventListener('input', e=>{
    searchQ = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openModal(DATA[card.dataset.idx]));
  });
}

const overlay = document.getElementById('overlay');
const modalInner = document.getElementById('modalInner');

function infoRow(k,v){
  const val = v ? v : '<span class="unknown">לא צוין בכתוב</span>';
  return `<tr><td class="k">${k}</td><td class="v">${val}</td></tr>`;
}
function listOrText(arr){
  if(!arr) return '';
  if(Array.isArray(arr)) return arr.join(', ');
  return arr;
}

function personIdxForName(raw){
  if(!raw) return null;
  const clean = String(raw).trim();
  let norm = normalizeHeb(clean);
  if(PEOPLE_LOOKUP.has(norm)) return PEOPLE_LOOKUP.get(norm);
  const core = clean.split(/[(,]/)[0].trim();
  norm = normalizeHeb(core);
  if(PEOPLE_LOOKUP.has(norm)) return PEOPLE_LOOKUP.get(norm);
  const loose = looseForm(norm);
  if(loose.length>=2 && LOOSE_LOOKUP.has(loose)) return LOOSE_LOOKUP.get(loose);
  return null;
}

function normalizeHeb(s){
  return (s || '')
    .replace(/[֑-ׇ]/g, '')
    .replace(/[^א-ת]/g, '');
}

const PREFIXES = ['ה','ו','ב','כ','ל','מ','ש'];
const SUFFIXES = ['ים','ות'];
const NIQQUD_RE = /[֑-ׇ]/g;

function tokenizeHeb(text){
  return (text || '').replace(NIQQUD_RE, '').replace(/־/g,' ').match(/[א-ת]+/g) || [];
}
function looseForm(w){ return (w || '').replace(/[וי]/g, ''); }

const PEOPLE_LOOKUP = new Map();
const LOOSE_LOOKUP = new Map();

function registerKey(phrase, idx){
  const norm = normalizeHeb(phrase);
  if (!norm || norm.length < 2) return;
  if (!PEOPLE_LOOKUP.has(norm)) PEOPLE_LOOKUP.set(norm, idx);
  const loose = looseForm(norm);
  if (loose.length >= 2 && !LOOSE_LOOKUP.has(loose)) LOOSE_LOOKUP.set(loose, idx);
}
function registerPhrase(phrase, idx){
  if (!phrase) return;
  registerKey(phrase, idx);
  const words = phrase.trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) words.forEach(w => { if (normalizeHeb(w).length >= 3) registerKey(w, idx); });
}

DATA.forEach((item, idx) => {
  registerPhrase(item.name, idx);
  (item.aliases || []).forEach(a => registerPhrase(a, idx));
});

function candidateForms(word){
  const w = normalizeHeb(word);
  if (!w) return [];
  const prefixVariants = [w];
  let cur = w;
  for (let i = 0; i < 2 && cur.length > 2; i++){
    if (!PREFIXES.includes(cur[0])) break;
    cur = cur.slice(1);
    prefixVariants.push(cur);
  }
  const all = new Set();
  prefixVariants.forEach(p => {
    all.add(p);
    SUFFIXES.forEach(suf => {
      if (p.endsWith(suf) && p.length > suf.length + 1) all.add(p.slice(0, -suf.length));
    });
  });
  return Array.from(all).filter(c => c.length >= 2);
}

function findPeopleIdx(word){
  const cands = candidateForms(word);
  for (const c of cands){ if (PEOPLE_LOOKUP.has(c)) return PEOPLE_LOOKUP.get(c); }
  for (const c of cands){
    const lc = looseForm(c);
    if (lc.length >= 2 && LOOSE_LOOKUP.has(lc)) return LOOSE_LOOKUP.get(lc);
  }
  return null;
}

function findAllPeopleIdxsInSelection(text){
  const words = tokenizeHeb(text);
  const seen = new Set();
  const result = [];
  for (const w of words){
    const idx = findPeopleIdx(w);
    if (idx !== null && !seen.has(idx)){ seen.add(idx); result.push({idx, word: w}); }
  }
  return result;
}

function identifyBlurb(item){
  const parts = [];
  if(item.roles && item.roles.length) parts.push(item.roles.join(', '));
  const sum = summaryLine(item);
  if(sum) parts.push(sum);
  return parts.length ? parts.join(' · ') : 'אין פרטים נוספים בכתוב';
}

function selectionQuoteHTML(text){

const TANAKH_BOOK_NAMES = ["דברי הימים א","דברי הימים ב","שמואל א","שמואל ב","מלכים א","מלכים ב",
  "בראשית","שמות","ויקרא","במדבר","דברים","יהושע","שופטים","ישעיה","ישעיהו","ירמיה","ירמיהו","יחזקאל",
  "הושע","יואל","עמוס","עובדיה","יונה","מיכה","נחום","חבקוק","צפניה","חגי","זכריה","מלאכי",
  "תהילים","תהלים","משלי","איוב","שיר השירים","רות","איכה","קהלת","אסתר","דניאל","עזרא","נחמיה"];

function parseVerseRef(ref){
  if (!ref) return null;
  for (const book of TANAKH_BOOK_NAMES){
    if (ref.startsWith(book + ' ')){
      const rest = ref.slice(book.length + 1).trim();
      const chapter = rest.split(',')[0].trim();
      if (chapter) return { bookId: book, ref: 'פרק ' + chapter };
    }
  }
  return null;
}

async function handleContextMenuClick(data){
  if (!data || data.itemId !== MENU_ITEM_ID) return;
  const text = (data.selectedText || '').trim();
  if (!text){
    if (hasOtzaria()) await Otzaria.call('notifications.showInApp', { message: 'יש לסמן תחילה שם אדם בטקסט', type: 'info' }).catch(()=>{});
    return;
  }
  const matches = findAllPeopleIdxsInSelection(text);
  if (matches.length > 1){
    openMultiModal(matches, text);
    if (hasOtzaria()){
      const quoteLine = tokenizeHeb(text).length > 1 ? ('הקטע שנבחר: "' + (text.length>200?text.slice(0,200)+'…':text) + '"\n\n') : '';
      const lines = matches.map(m=>'• ' + DATA[m.idx].name + ' (זוהה מהמילה: ' + m.word + ') — ' + identifyBlurb(DATA[m.idx])).join('\n');
      await goToPluginOnConfirm(
        '👤 נמצאו ' + matches.length + ' אישים',
        quoteLine + 'נמצאו במדריך כמה אישים בקטע שסימנתם:\n\n' + lines + '\n\nהרשימה המלאה כבר פתוחה ברקע. לחיצה על אישור תעביר אותך ללשונית "אישים בתנ״ך".',
        '👤 נמצאו ' + matches.length + ' אישים — פתוח בלשונית "אישים בתנ״ך".'
      );
    }
    return;
  }
  if (matches.length === 1){
    const item = DATA[matches[0].idx];
    openModal(item);
    if (hasOtzaria()){
      const firstVerse = item.verses[0] ? item.verses[0].ref : '';
      const quoteLine = tokenizeHeb(text).length > 1 ? ('הקטע שנבחר: "' + (text.length>200?text.slice(0,200)+'…':text) + '"\n\n') : '';
      const content = quoteLine + identifyBlurb(item) + (firstVerse ? '\n\nלפי: ' + firstVerse : '')
        + '\n\nהכרטיס המלא כבר פתוח ברקע. לחיצה על אישור תעביר אותך ללשונית "אישים בתנ״ך".';
      await goToPluginOnConfirm('👤 ' + item.name, content, '👤 זוהה: ' + item.name);
    }
  } else {
    openNotFoundModal(text);
    if (hasOtzaria()){
      await goToPluginOnConfirm(
        '❓ לא נמצא: ' + text,
        'לא נמצא ערך במדריך עבור "' + text + '".\n\nטופס להצעת תוספת כבר פתוח ברקע. לחיצה על אישור תעביר אותך ללשונית "אישים בתנ״ך".',
        '❓ לא זוהה ערך עבור "' + text + '" — טופס הצעת תוספת פתוח בלשונית "אישים בתנ״ך".'
      );
    }
  }
}

document.getElementById('lightbulb-btn').addEventListener('click', async () => {
  if (!hasOtzaria()) return;
  const msg = window.prompt('מה תרצה לשתף לגבי התוסף? (הודעה תישלח למפתח)');
  if (!msg || !msg.trim()) return;
  try {
    await Otzaria.call('feedback.sendEmail', { to: REPORT_EMAIL, subject: 'משוב על תוסף אישים בתנ״ך', body: msg.trim(), includeSystemInfo: true });
    await Otzaria.call('notifications.showInApp', { message: 'המשוב נשלח, תודה!', type: 'success' }).catch(()=>{});
  } catch(e){
    await Otzaria.call('notifications.showInApp', { message: 'שגיאה בשליחת המשוב', type: 'error' }).catch(()=>{});
  }
});

function waitForOtzaria(elapsed){
  if (window.Otzaria && typeof Otzaria.on === 'function'){
    // פריט התפריט האחיד נרשם ע"י מעטפת "מדעי התנ״ך" (index.html), לא כאן.
    Otzaria.on('reader.context_menu_item_clicked', handleContextMenuClick);
    return;
  }
  setTimeout(() => waitForOtzaria(elapsed + 200), 200);
}
waitForOtzaria(0);

document.getElementById('addNewBtn').addEventListener('click', ()=> openNotFoundModal(''));

applyOverrides();
render();

(function(){
  try {
    const focus = new URLSearchParams(location.search).get('focus');
    if (focus) handleContextMenuClick({ itemId: MENU_ITEM_ID, selectedText: focus });
  } catch(e){}
})();
</script>
